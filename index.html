            } else {

                themeToggle.textContent = '☀️';

<script>
    // ================= ВАШИ ДАННЫЕ ИЗ FIREBASE =================

        authDomain: "energy-1363c.firebaseapp.com",

    // ============================================================

    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ----- ТЕГИ (как вы просили) -----
    const AVAILABLE_TAGS = [
        { emoji: "🚫", name: "Без сахара" }, { emoji: "🍬", name: "С сахаром" }, { emoji: "😵", name: "50/50 на сахаре" },
        { emoji: "🥤", name: "Оригинальный" }, { emoji: "🍇", name: "Обычные фрукты" },
        { emoji: "🌴", name: "Экзотический" }, { emoji: "⭐", name: "Эксклюзив" },
        { emoji: "🍋", name: "Кислый" }, { emoji: "🍰", name: "Сладкий" },
        { emoji: "🍬🍬", name: "ОЧЕНЬ сладкий" }, { emoji: "💧", name: "Пресный" },
        { emoji: "❓", name: "Не пробовал" }
    ];

    let energyDrinks = [];
    let currentSort = "desc";
    let selectedFilterTags = [];
    let searchQuery = "";
    let unsubscribe = null;

    // DOM-элементы
    const cardsContainer = document.getElementById('cardsContainer');
    const filterTagsContainer = document.getElementById('filterTagsContainer');
    const sortDescBtn = document.querySelector('[data-sort="desc"]');
    const sortAscBtn = document.querySelector('[data-sort="asc"]');
    const resetFiltersBtn = document.getElementById('resetFiltersBtn');
    const searchInput = document.getElementById('searchInput');
    const syncStatus = document.getElementById('syncStatus');

    // Подключение к Firestore (реальное время)
    function connectToFirestore() {
        if (unsubscribe) unsubscribe();
        syncStatus.innerHTML = '<span>🔄</span> Загрузка данных...';
        unsubscribe = db.collection('energydrinks')
            .orderBy('createdAt', 'desc')
            .onSnapshot((snapshot) => {
                energyDrinks = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    energyDrinks.push({
                        id: doc.id,
                        name: data.name,
                        imageData: data.imageData || null,
                        tags: data.tags || [],
                        rating: data.rating || 3,
                        taste: data.taste || "не указан",
                        description: data.description || "Нет описания"
                    });
                });
                syncStatus.innerHTML = '<span>✅</span> Синхронизировано с облаком';
                setTimeout(() => {
                    if (syncStatus.innerHTML.includes('Синхронизировано'))
                        syncStatus.innerHTML = '<span>☁️</span> Данные в облаке';
                }, 2000);
                applyFiltersAndRender();
            }, (error) => {
                console.error("Firestore error:", error);
                syncStatus.innerHTML = '<span>⚠️</span> Ошибка подключения, проверьте интернет и настройки Firebase';
            });
    }

    // CRUD-операции с Firebase
    async function addToFirestore(drink) {
        try {
            await db.collection('energydrinks').add({
                ...drink,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            return true;
        } catch(e) { alert("Ошибка сохранения: "+e.message); return false; }
    }
    async function updateInFirestore(id, drink) {
        try {
            await db.collection('energydrinks').doc(id).update(drink);
            return true;
        } catch(e) { alert("Ошибка обновления: "+e.message); return false; }
    }
    async function deleteFromFirestore(id) {
        try {
            await db.collection('energydrinks').doc(id).delete();
            return true;
        } catch(e) { alert("Ошибка удаления: "+e.message); return false; }
    }

    // Вспомогательные функции
    function renderTagCheckboxes(container, selectedTags = []) {
        container.innerHTML = '';
        AVAILABLE_TAGS.forEach(tag => {
            const label = document.createElement('label');
            label.className = 'tag-check';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = tag.name;
            if (selectedTags.includes(tag.name)) cb.checked = true;
            const span = document.createElement('span');
            span.innerText = `${tag.emoji} ${tag.name}`;
            label.appendChild(cb);
            label.appendChild(span);
            container.appendChild(label);
        });
    }
    function getSelectedTagsFromContainer(container) {
        return Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    function getImageSrc(drink) {
        return drink.imageData || "https://via.placeholder.com/200?text=Нет+фото";
    }

    // Добавление
    async function addNewDrink(event) {
        event.preventDefault();
        const name = document.getElementById('drinkName').value.trim();
        const rating = parseFloat(document.getElementById('drinkRating').value);
        const taste = document.getElementById('drinkTaste').value.trim();
        const description = document.getElementById('drinkDescription').value.trim() || "Нет описания";
        const selectedTags = getSelectedTagsFromContainer(tagsCheckboxesDiv);

        if (!name) { alert("Введите название"); return; }
        if (!taste) { alert("Укажите вкус"); return; }
        if (selectedTags.length === 0) { alert("Выберите хотя бы один тег"); return; }

        let imageData = selectedImageBase64;
        const success = await addToFirestore({ name, imageData, tags: selectedTags, rating, taste, description });
        if (success) {
            addModal.classList.remove('active');
            addDrinkForm.reset();
            selectedImageBase64 = null;
            imagePreviewDiv.innerHTML = '';
            renderTagCheckboxes(tagsCheckboxesDiv, []);
            searchQuery = ""; searchInput.value = "";
            resetFiltersAndSort();
        }
    }

    // Редактирование
    function openEditModal(drink) {
        document.getElementById('editDrinkId').value = drink.id;
        document.getElementById('editName').value = drink.name;
        document.getElementById('editRating').value = drink.rating;
        document.getElementById('editTaste').value = drink.taste || "";
        document.getElementById('editDescription').value = drink.description || "";
        renderTagCheckboxes(editTagsCheckboxesDiv, drink.tags || []);
        editImagePreviewDiv.innerHTML = '';
        editSelectedImageBase64 = null;
        if (drink.imageData) {
            const img = document.createElement('img');
            img.src = drink.imageData;
            img.style.maxWidth = '100px';
            img.style.borderRadius = '16px';
            editImagePreviewDiv.appendChild(img);
        }
        editModal.classList.add('active');
    }

    async function saveEdit(event) {
        event.preventDefault();
        const id = document.getElementById('editDrinkId').value;
        const name = document.getElementById('editName').value.trim();
        const rating = parseFloat(document.getElementById('editRating').value);
        const taste = document.getElementById('editTaste').value.trim();
        const description = document.getElementById('editDescription').value.trim() || "Нет описания";
        const selectedTags = getSelectedTagsFromContainer(editTagsCheckboxesDiv);
        if (!name) { alert("Введите название"); return; }
        if (!taste) { alert("Укажите вкус"); return; }
        if (selectedTags.length === 0) { alert("Выберите хотя бы один тег"); return; }

        let imageData = editSelectedImageBase64;
        if (!imageData) {
            const existing = energyDrinks.find(d => d.id === id);
            if (existing) imageData = existing.imageData;
        }
        const success = await updateInFirestore(id, { name, imageData, tags: selectedTags, rating, taste, description });
        if (success) {
            editModal.classList.remove('active');
            detailModal.classList.remove('active');
        }
    }

    async function deleteDrink(drinkId) {
        if (confirm("Удалить энергетик навсегда? Он исчезнет на всех устройствах.")) {
            await deleteFromFirestore(drinkId);
            detailModal.classList.remove('active');
        }
    }

    // Фильтрация и рендер
    function filterDrinks(drinks) {
        let result = [...drinks];
        if (searchQuery.trim()) {
            const lower = searchQuery.toLowerCase();
            result = result.filter(d => d.name.toLowerCase().includes(lower));
        }
        if (selectedFilterTags.length) {
            result = result.filter(d => selectedFilterTags.every(tag => d.tags.includes(tag)));
        }
        return result;
    }
    function sortDrinks(drinks) {
        const sorted = [...drinks];
        if (currentSort === 'desc') sorted.sort((a,b) => b.rating - a.rating);
        else sorted.sort((a,b) => a.rating - b.rating);
        return sorted;
    }
function applyFiltersAndRender() {
    const filtered = filterDrinks(energyDrinks);
    const sorted = sortDrinks(filtered);
    renderCards(sorted);
    
    // ===== СЧЁТЧИК =====
    const total = energyDrinks.length;
    const shown = filtered.length;
    const counter = document.getElementById('energyCounter');
    if (counter) {
        if (shown === total) {
            counter.innerHTML = ` Всего энергетиков: ${total}`;
        } else {
            counter.innerHTML = ` Показано: ${shown} из ${total}`;
        }
    }
}

    function renderCards(drinksArray) {
        if (!drinksArray.length) {
            cardsContainer.innerHTML = `<div class="empty-message">🧃 Добавьте первый энергетик через кнопку «+». Данные будут в облаке и на всех устройствах.</div>`;
            return;
        }
        cardsContainer.innerHTML = drinksArray.map(drink => `
            <div class="drink-card" data-id="${drink.id}">
                <img class="card-img" src="${getImageSrc(drink)}" alt="${drink.name}" onerror="this.src='https://via.placeholder.com/100?text=Ошибка'">
                <div class="card-info">
                    <div class="card-title">${escapeHtml(drink.name)}</div>
                    <div class="tags-row">
                        <div class="tags-list">
                            ${drink.tags.map(tag => {
                                const obj = AVAILABLE_TAGS.find(t => t.name === tag);
                                const display = obj ? `${obj.emoji} ${obj.name}` : tag;
                                return `<span class="tag-badge">${escapeHtml(display)}</span>`;
                            }).join('')}
                        </div>
                        <div class="rating-value">⭐ ${drink.rating.toFixed(1)}</div>
                    </div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.drink-card').forEach(card => {
            const id = card.getAttribute('data-id');
            card.addEventListener('click', () => {
                const drink = energyDrinks.find(d => d.id === id);
                if (drink) openDetailModal(drink);
            });
        });
    }

    function openDetailModal(drink) {
        const tagSpans = drink.tags.map(tag => {
            const obj = AVAILABLE_TAGS.find(t => t.name === tag);
            const display = obj ? `${obj.emoji} ${obj.name}` : tag;
            return `<span class="tag-badge">${escapeHtml(display)}</span>`;
        }).join('');
        document.getElementById('detailContent').innerHTML = `
            <div class="detail-layout">
                <div class="detail-img"><img src="${getImageSrc(drink)}" onerror="this.src='https://via.placeholder.com/280?text=Ошибка'"></div>
                <div class="detail-info">
                    <h2>${escapeHtml(drink.name)}</h2>
                    <div class="detail-tags">${tagSpans}</div>
                    <div style="font-size:1.5rem; font-weight:600;">⭐ ${drink.rating.toFixed(1)} / 5</div>
                    <div class="taste-block">👅 Вкус: ${escapeHtml(drink.taste)}</div>
                    <div class="detail-description">📝 ${escapeHtml(drink.description)}</div>
                    <div class="action-buttons">
                        <button class="edit-button" id="editDrinkBtn">✏️ Изменить</button>
                        <button class="delete-button" id="deleteDrinkBtn">🗑️ Удалить</button>
                    </div>
                </div>
            </div>
        `;
        detailModal.classList.add('active');
        document.getElementById('editDrinkBtn')?.addEventListener('click', () => {
            detailModal.classList.remove('active');
            openEditModal(drink);
        });
        document.getElementById('deleteDrinkBtn')?.addEventListener('click', () => deleteDrink(drink.id));
    }

    function renderFilterTags() {
        filterTagsContainer.innerHTML = '';
        AVAILABLE_TAGS.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'filter-tag';
            if (selectedFilterTags.includes(tag.name)) span.classList.add('selected');
            span.innerText = `${tag.emoji} ${tag.name}`;
            span.addEventListener('click', () => {
                if (selectedFilterTags.includes(tag.name)) selectedFilterTags = selectedFilterTags.filter(t => t !== tag.name);
                else selectedFilterTags.push(tag.name);
                renderFilterTags();
                applyFiltersAndRender();
            });
            filterTagsContainer.appendChild(span);
        });
    }

    function resetFiltersAndSort() {
        currentSort = "desc";
        selectedFilterTags = [];
        searchQuery = "";
        searchInput.value = "";
        sortDescBtn.classList.add('active');
        sortAscBtn.classList.remove('active');
        renderFilterTags();
        applyFiltersAndRender();
    }

    // Предпросмотр фото
    let selectedImageBase64 = null;
    let editSelectedImageBase64 = null;
    const drinkImageFile = document.getElementById('drinkImageFile');
    const imagePreviewDiv = document.getElementById('imagePreview');
    const editImageFile = document.getElementById('editImageFile');
    const editImagePreviewDiv = document.getElementById('editImagePreview');

    drinkImageFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) { selectedImageBase64 = null; imagePreviewDiv.innerHTML = ''; return; }
        const reader = new FileReader();
        reader.onload = (ev) => { selectedImageBase64 = ev.target.result; imagePreviewDiv.innerHTML = `<img src="${selectedImageBase64}" style="max-width:100px; border-radius:16px;">`; };
        reader.readAsDataURL(file);
    });
    editImageFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) { editSelectedImageBase64 = null; editImagePreviewDiv.innerHTML = ''; return; }
        const reader = new FileReader();
        reader.onload = (ev) => { editSelectedImageBase64 = ev.target.result; editImagePreviewDiv.innerHTML = `<img src="${editSelectedImageBase64}" style="max-width:100px; border-radius:16px;">`; };
        reader.readAsDataURL(file);
    });
    // Закрытие модалок
    const addModal = document.getElementById('addModal');
    const detailModalEl = document.getElementById('detailModal');
    const editModalEl = document.getElementById('editModal');
    function closeModals() {
        detailModalEl.classList.remove('active');
        addModal.classList.remove('active');
        editModalEl.classList.remove('active');
    }
    document.getElementById('closeAddModal').onclick = closeModals;
    document.getElementById('closeDetailModal').onclick = closeModals;
    document.getElementById('closeEditModal').onclick = closeModals;
    window.onclick = (e) => { if (e.target === addModal || e.target === editModalEl || e.target === detailModalEl) closeModals(); };
    document.getElementById('openAddModalBtn').onclick = () => addModal.classList.add('active');

    // Сортировка и сброс
    sortDescBtn.onclick = () => { currentSort = 'desc'; sortDescBtn.classList.add('active'); sortAscBtn.classList.remove('active'); applyFiltersAndRender(); };
    sortAscBtn.onclick = () => { currentSort = 'asc'; sortAscBtn.classList.add('active'); sortDescBtn.classList.remove('active'); applyFiltersAndRender(); };
    resetFiltersBtn.onclick = resetFiltersAndSort;
    searchInput.oninput = (e) => { searchQuery = e.target.value; applyFiltersAndRender(); };

    // Инициализация
    const tagsCheckboxesDiv = document.getElementById('tagsCheckboxes');
    const editTagsCheckboxesDiv = document.getElementById('editTagsCheckboxes');
    const addDrinkForm = document.getElementById('addDrinkForm');
    const editDrinkForm = document.getElementById('editDrinkForm');

    renderTagCheckboxes(tagsCheckboxesDiv, []);
    renderTagCheckboxes(editTagsCheckboxesDiv, []);
    renderFilterTags();
    connectToFirestore();

    addDrinkForm.addEventListener('submit', addNewDrink);
    editDrinkForm.addEventListener('submit', saveEdit);

    // ========== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ (без сохранения в localStorage) ==========
    const themeToggle = document.getElementById('themeToggle');
    
    const toggleTheme = () => {
        const isDark = document.body.classList.contains('dark-mode');
        const logo = document.getElementById('logoImage');
        
        if (isDark) {
            document.body.classList.remove('dark-mode');
            themeToggle.textContent = '🌙';
            if (logo) logo.src = 'logo-light.png';  // Меняем на светлый лого
        } else {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
            if (logo) logo.src = 'logo-dark.png';   // Меняем на тёмный лого
        }
    };
    
    // Начальное состояние: светлая тема
    document.body.classList.remove('dark-mode');
    themeToggle.textContent = '🌙';
    
    // Вешаем обработчик
    if (themeToggle) {
        themeToggle.addEventListener('click', toggleTheme);
    }
</script>
</body>
</html>
