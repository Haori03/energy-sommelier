<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Профиль | Энергетический сомелье Ivan</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        .app-container { max-width: 1000px; margin: 0 auto; }
        .btn-back { background: #4a6d8c; color: white; border: none; padding: 0 20px; height: 52px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-back:hover { transform: scale(0.96); background: #2b4f6e; }
        
        .profile-card { background: var(--card-bg); border-radius: 32px; padding: 32px; box-shadow: var(--shadow); display: flex; gap: 28px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; position: relative; border: 1px solid var(--border); }
        .avatar-wrapper { position: relative; flex-shrink: 0; }
        .avatar { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; background: var(--bg); border: 4px solid var(--border); }
        .avatar-edit { position: absolute; bottom: 4px; right: 4px; background: var(--primary); color: white; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .avatar-edit:hover { transform: scale(1.1); }
        .profile-info { flex: 1; min-width: 200px; }
        .profile-info h1 { font-size: 2rem; margin-bottom: 8px; word-break: break-word; }
        .profile-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
        .role-badge { background: var(--tag-bg); padding: 6px 14px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; }
        .role-badge.admin { background: #fef3c7; color: #92400e; }
        body.dark-mode .role-badge.admin { background: #422006; color: #fbbf24; }
        .login-label { color: var(--text-muted); font-size: 0.95rem; }
        .btn-edit-name { background: #4a6d8c; color: white; border: none; padding: 8px 18px; border-radius: 24px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .btn-edit-name:hover { background: #2b4f6e; }
        
        /* Вкладки с фоном */
        .tabs { display: flex; gap: 12px; margin-bottom: 20px; background: var(--card-bg); padding: 8px; border-radius: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .tab-btn { flex: 1; background: transparent; border: none; padding: 14px 20px; border-radius: 20px; font-size: 1rem; font-weight: 600; cursor: pointer; color: var(--text); transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-btn:not(.active):hover { background: var(--tag-bg); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
        .stat-card { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); text-align: center; border: 1px solid var(--border); }
        .stat-icon { font-size: 2rem; margin-bottom: 8px; }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 2rem; font-weight: 900; color: var(--text); }
        .stat-sub { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }
        
        .friends-header { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .friends-header input { flex: 1; min-width: 200px; padding: 12px 18px; border-radius: 40px; border: 1px solid var(--input-border); font-size: 1rem; background: var(--input-bg); color: var(--text); }
        .friends-list { display: flex; flex-direction: column; gap: 12px; }
        .friend-card { background: var(--card-bg); border-radius: 24px; padding: 14px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; border: 1px solid var(--border); transition: transform 0.2s; }
        .friend-card:hover { transform: translateY(-2px); }
        .friend-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: var(--bg); flex-shrink: 0; pointer-events: none; }
        .friend-info { flex: 1; min-width: 0; pointer-events: none; }
        .friend-name { font-weight: 700; font-size: 1.05rem; }
        .friend-login { color: var(--text-muted); font-size: 0.85rem; }
        .btn-remove-friend { background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .btn-remove-friend:hover { background: #c53030; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: 24px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        
        /* СТИЛИ МОДАЛОК (то, чего не хватало) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 500px; border-radius: 36px; padding: 28px 24px; position: relative; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); }
        .modal-close { position: absolute; top: 18px; right: 24px; font-size: 28px; background: none; border: none; cursor: pointer; color: var(--text); }
        
        @media (max-width: 600px) {
            .profile-card { flex-direction: column; text-align: center; padding: 24px 16px; }
            .profile-meta { justify-content: center; }
            .avatar { width: 120px; height: 120px; }
            .profile-info h1 { font-size: 1.5rem; }
            .tab-btn { padding: 12px 12px; font-size: 0.9rem; }
            .stat-value { font-size: 1.6rem; }
            .friend-card { flex-wrap: wrap; justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo"><img id="logoImage" src="logo-light.png" alt="Логотип"></div>
        <div class="header-buttons">
            <button class="btn-back" id="backBtn">← К коллекции</button>
            <div class="user-status" id="userStatus">Гость</div>
            <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
    </div>

    <!-- Профиль -->
    <div class="profile-card">
        <div class="avatar-wrapper">
            <img id="avatarImg" class="avatar" src="logo-light.png" alt="Аватар">
            <label class="avatar-edit" id="avatarEditLabel" for="avatarUpload" title="Загрузить аватар">✏️</label>
            <input type="file" id="avatarUpload" accept="image/*" style="display:none">
        </div>
        <div class="profile-info">
            <h1 id="displayName">Загрузка...</h1>
            <div class="profile-meta">
                <span class="role-badge" id="roleBadge">Пользователь</span>
                <span class="login-label" id="loginLabel"></span>
            </div>
            <button class="btn-edit-name" id="editNameBtn">Изменить имя</button>
            
            <div class="action-buttons-profile" id="drinkActionBtns">
                <button class="btn-drink" id="btnIDrank">🥤 Я выпил</button>
                <button class="btn-delete-drink" id="btnDeleteDrank">🗑️ Удалить выпитое</button>
            </div>
        </div>
    </div>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="stats">📊 Статистика</button>
        <button class="tab-btn" data-tab="friends">👥 Друзья</button>
    </div>

    <!-- Контент: Статистика -->
    <div id="statsTab" class="tab-content active">
        <div class="stats-grid" id="mainStatsGrid">
            <div class="empty-state">Загрузка статистики...</div>
        </div>

        <div class="extended-stats" id="extendedStatsGrid"></div>
        <div style="text-align: center;" id="editStatsBtnContainer"></div>

        <!-- Календарь -->
        <div class="calendar-container">
            <div class="calendar-header">
                <button class="cal-nav-btn" id="prevMonth">←</button>
                <div class="calendar-title" id="calendarTitle">Месяц</div>
                <button class="cal-nav-btn" id="nextMonth">→</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- Контент: Друзья -->
    <div id="friendsTab" class="tab-content">
        <div class="friends-header" id="addFriendSection">
            <input type="text" id="friendLoginInput" placeholder="Введите логин друга для заявки...">
            <button id="addFriendBtn" class="btn-primary">Отправить заявку</button>
        </div>
        
        <div id="incomingRequestsSection"></div>
        <div id="sentRequestsSection"></div>
        
        <div class="friend-section-title">Мои друзья</div>
        <div id="friendsList" class="friends-list"></div>
    </div>
</div>

<!-- Модалка: Я выпил -->
<div id="drinkLogModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" id="closeDrinkLogModal">&times;</button>
        <h2>Что выпил?</h2>
        <form id="drinkLogForm">
            <div class="form-group">
                <label>Название энергетика</label>
                <input type="text" id="logDrinkName" list="drinkSuggestions" placeholder="Начните вводить..." required>
                <datalist id="drinkSuggestions"></datalist>
            </div>
            <div class="form-group">
                <label>Количество (банок)</label>
                <input type="number" id="logDrinkQty" min="1" value="1" required>
            </div>
            <div class="form-group">
                <label>Дата</label>
                <input type="date" id="logDrinkDate" required>
            </div>
            <button type="submit" class="btn-primary" style="width:100%">Добавить</button>
        </form>
    </div>
</div>

<!-- Модалка: Удалить выпитое -->
<div id="deleteDrankModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" id="closeDeleteDrankModal">&times;</button>
        <h2>Выпитое</h2>
        <div id="drinkLogsList" style="max-height: 50vh; overflow-y: auto; margin-top: 15px;"></div>
    </div>
</div>

<!-- Модалка: Редактировать расширенную статистику -->
<div id="editStatsModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-close" id="closeEditStatsModal">&times;</button>
        <h2>Редактировать статы</h2>
        <form id="editStatsForm">
            <div class="form-group"><label>Любимый энергетик</label><input type="text" id="statFavDrink" list="drinkSuggestions2"><datalist id="drinkSuggestions2"></datalist></div>
            <div class="form-group"><label>Нелюбимый энергетик</label><input type="text" id="statLeastDrink"></div>
            <div class="form-group"><label>О себе / Другое</label><textarea id="statCustomNote" rows="3"></textarea></div>
            <button type="submit" class="btn-primary" style="width:100%">Сохранить</button>
        </form>
    </div>
</div>

<!-- Модалка: Мои отзывы -->
<div id="myReviewsModal" class="modal-overlay">
    <div class="modal-content profile-modal">
        <button class="modal-close" id="closeMyReviewsModal">&times;</button>
        <h2>Отзывы</h2>
        <div id="myReviewsList" style="margin-top: 15px; max-height: 60vh; overflow-y: auto;"></div>
    </div>
</div>

<!-- Модалка: Избранное -->
<div id="myFavsModal" class="modal-overlay">
    <div class="modal-content profile-modal">
        <button class="modal-close" id="closeMyFavsModal">&times;</button>
        <h2>Избранное</h2>
        <div id="myFavsList" class="fav-list-grid" style="margin-top: 15px; max-height: 60vh; overflow-y: auto;"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDQGjVUA8w66eGudNSK0s6PMOSjEYQbpWY",
    authDomain: "energy-1363c.firebaseapp.com",
    projectId: "energy-1363c",
    storageBucket: "energy-1363c.firebasestorage.app",
    messagingSenderId: "735189971999",
    appId: "1:735189971999:web:bf662f3add5b5967ae912a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const saved = localStorage.getItem('energyUser');
const currentUser = saved ? JSON.parse(saved) : null;
if (!currentUser) { window.location.replace('index.html'); }

// Читаем, чей профиль мы хотим открыть (свой или друга по ссылке ?user=login)
const urlParams = new URLSearchParams(window.location.search);
const viewUserLogin = urlParams.get('user');
const targetLogin = viewUserLogin || currentUser.login;
const isOwnProfile = targetLogin === currentUser.login;

let userDocRef = null;
let userProfile = {};
let allDrinks = []; 
let allLogs = []; 
let currentCalDate = new Date();

// ===== Тема =====
const themeToggle = document.getElementById('themeToggle');
function applyTheme(dark) {
    document.body.classList.toggle('dark-mode', dark);
    themeToggle.textContent = dark ? '☀️' : '🌙';
    const logo = document.getElementById('logoImage');
    if (logo) logo.src = dark ? 'logo-dark.png' : 'logo-light.png';
}
applyTheme(localStorage.getItem('energyTheme') === 'dark');
themeToggle.onclick = () => {
    const isDark = !document.body.classList.contains('dark-mode');
    applyTheme(isDark);
    localStorage.setItem('energyTheme', isDark ? 'dark' : 'light');
};
document.getElementById('backBtn').onclick = () => window.location.href = 'index.html';

// ===== Хелперы =====
function escapeHtml(str) { return str ? String(str).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]) : ''; }
function getAvatarUri(name, login) { return `data:image/svg+xml;charset=utf-8,` + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="200" height="200" fill="#7c3aed"/><text x="100" y="130" font-family="Arial,sans-serif" font-size="90" font-weight="bold" fill="#fff" text-anchor="middle">${(name || login || '?')[0].toUpperCase()}</text></svg>`); }
function resizeImageToSquare(file, targetSize = 400, quality = 0.85) { return new Promise((resolve, reject) => { if (!file || !file.type.match('image.*')) return resolve(null); const reader = new FileReader(); reader.onload = e => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); canvas.width = canvas.height = targetSize; const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, targetSize, targetSize); const ratio = img.width / img.height; let dw, dh, dx, dy; if (ratio > 1) { dw = targetSize; dh = targetSize / ratio; dx = 0; dy = (targetSize - dh) / 2; } else { dh = targetSize; dw = targetSize * ratio; dx = (targetSize - dw) / 2; dy = 0; } ctx.drawImage(img, dx, dy, dw, dh); resolve(canvas.toDataURL('image/jpeg', quality)); }; img.onerror = reject; img.src = e.target.result; }; reader.onerror = reject; reader.readAsDataURL(file); }); }

// ===== Загрузка данных =====
async function init() {
    // Скрываем кнопки редактирования, если смотрим чужой профиль
    if (!isOwnProfile) {
        document.getElementById('editNameBtn').style.display = 'none';
        document.getElementById('avatarEditLabel').style.display = 'none';
        document.getElementById('drinkActionBtns').style.display = 'none';
        document.getElementById('addFriendSection').style.display = 'none'; // Нельзя добавлять друзей со страницы чужого профиля
        document.getElementById('editStatsBtnContainer').style.display = 'none';
    }

    // Загружаем все энергетики для автокомплита
    const drinksSnap = await db.collection('energydrinks').get();
    allDrinks = drinksSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const optionsHtml = allDrinks.map(d => `<option value="${escapeHtml(d.name)}">`).join('');
    document.getElementById('drinkSuggestions').innerHTML = optionsHtml;
    document.getElementById('drinkSuggestions2').innerHTML = optionsHtml;

    // Загружаем профиль
    const snap = await db.collection('users').where('login', '==', targetLogin).get();
    if (!snap.empty) {
        userDocRef = snap.docs[0].ref;
        userProfile = snap.docs[0].data();
        
        if (!userProfile.createdAt && isOwnProfile) {
            await userDocRef.update({ createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            userProfile.createdAt = new Date();
        }

        renderProfile();
        await loadLogs(); 
        loadFriendsAndRequests();
    } else {
        document.getElementById('displayName').textContent = 'Пользователь не найден';
    }
}

function renderProfile() {
    const login = userProfile.login;
    const name = userProfile.displayName || login;
    const isAdmin = userProfile.role === 'admin';
    document.getElementById('displayName').textContent = name;
    document.getElementById('loginLabel').textContent = '@' + login;
    document.getElementById('roleBadge').textContent = isAdmin ? '👑 Админ' : '👤 Пользователь';
    document.getElementById('roleBadge').classList.toggle('admin', isAdmin);
    document.getElementById('userStatus').textContent = `${currentUser.login}`;
    document.getElementById('avatarImg').src = userProfile.avatar || getAvatarUri(name, login);
}

document.getElementById('avatarUpload').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const base64 = await resizeImageToSquare(file, 400, 0.85);
    if (!base64) return;
    await userDocRef.update({ avatar: base64 });
    userProfile.avatar = base64;
    document.getElementById('avatarImg').src = base64;
};

document.getElementById('editNameBtn').onclick = async () => {
    const name = prompt('Введите новое имя:', userProfile.displayName || userProfile.login);
    if (!name || !name.trim()) return;
    await userDocRef.update({ displayName: name.trim() });
    userProfile.displayName = name.trim();
    renderProfile();
};

// ===== Вкладки =====
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
    };
});

// ===== Выпитое (Логи) =====
async function loadLogs() {
    const snap = await db.collection('drink_logs').where('userLogin', '==', userProfile.login).get();
    allLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    
    const totalDrank = allLogs.reduce((sum, log) => sum + (log.quantity || 0), 0);
    
    const counts = {};
    allLogs.forEach(log => counts[log.drinkName] = (counts[log.drinkName] || 0) + log.quantity);
    let maxDrink = '—', maxCount = 0;
    for (const [drink, count] of Object.entries(counts)) {
        if (count > maxCount) { maxDrink = drink; maxCount = count; }
    }

    renderExtendedStats(totalDrank, maxDrink, maxCount);
    renderCalendar(); 
}

function renderExtendedStats(totalDrank, maxDrink, maxCount) {
    const regDate = userProfile.createdAt ? (userProfile.createdAt.toDate ? userProfile.createdAt.toDate() : new Date(userProfile.createdAt)) : new Date();
    const stats = userProfile.stats || {};

    document.getElementById('extendedStatsGrid').innerHTML = `
        <div class="ext-stat-item"><div class="ext-stat-label">Дата регистрации</div><div class="ext-stat-value">${regDate.toLocaleDateString('ru-RU')}</div></div>
        <div class="ext-stat-item"><div class="ext-stat-label">Любимый</div><div class="ext-stat-value">${escapeHtml(stats.favoriteDrink) || '—'}</div></div>
        <div class="ext-stat-item"><div class="ext-stat-label">Нелюбимый</div><div class="ext-stat-value">${escapeHtml(stats.leastFavoriteDrink) || '—'}</div></div>
        <div class="ext-stat-item"><div class="ext-stat-label">Всего выпито</div><div class="ext-stat-value">${totalDrank} шт.</div></div>
        <div class="ext-stat-item"><div class="ext-stat-label">Больше всего выпито</div><div class="ext-stat-value">${maxDrink !== '—' ? `${escapeHtml(maxDrink)} (${maxCount} шт.)` : '—'}</div></div>
        <div class="ext-stat-item"><div class="ext-stat-label">Другое</div><div class="ext-stat-value">${escapeHtml(stats.customNote) || '—'}</div></div>
    `;
    
    if (isOwnProfile) {
        document.getElementById('editStatsBtnContainer').innerHTML = `<button class="btn-edit-stats" onclick="openEditStats()">✏️ Редактировать</button>`;
    }
    loadStatsCards(totalDrank);
}

window.openEditStats = () => {
    const stats = userProfile.stats || {};
    document.getElementById('statFavDrink').value = stats.favoriteDrink || '';
    document.getElementById('statLeastDrink').value = stats.leastFavoriteDrink || '';
    document.getElementById('statCustomNote').value = stats.customNote || '';
    document.getElementById('editStatsModal').classList.add('active');
};

document.getElementById('editStatsForm').onsubmit = async (e) => {
    e.preventDefault();
    const newStats = {
        favoriteDrink: document.getElementById('statFavDrink').value.trim(),
        leastFavoriteDrink: document.getElementById('statLeastDrink').value.trim(),
        customNote: document.getElementById('statCustomNote').value.trim()
    };
    await userDocRef.update({ stats: newStats });
    userProfile.stats = newStats;
    document.getElementById('editStatsModal').classList.remove('active');
    loadLogs(); 
};

// ===== Календарь =====
function renderCalendar() {
    const year = currentCalDate.getFullYear();
    const month = currentCalDate.getMonth();
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    document.getElementById('calendarTitle').textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay(); 
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const startOffset = firstDay === 0 ? 6 : firstDay - 1; 

    let html = `
        <div class="cal-day-name">Пн</div><div class="cal-day-name">Вт</div><div class="cal-day-name">Ср</div>
        <div class="cal-day-name">Чт</div><div class="cal-day-name">Пт</div><div class="cal-day-name">Сб</div><div class="cal-day-name">Вс</div>
    `;

    for (let i = 0; i < startOffset; i++) html += `<div class="cal-day empty"></div>`;

    for (let day = 1; day <= daysInMonth; day++) {
        const dayLogs = allLogs.filter(l => {
            const d = l.date ? (l.date.toDate ? l.date.toDate() : new Date(l.date)) : null;
            return d && d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
        });
        const cans = dayLogs.reduce((sum, l) => sum + l.quantity, 0);
        
        let dots = '';
        if (cans > 0) {
            const visualDots = Math.min(cans, 10);
            dots = `<div class="dots-container">${'<div class="red-dot"></div>'.repeat(visualDots)}</div>`;
        }

        const isToday = new Date().getDate() === day && new Date().getMonth() === month && new Date().getFullYear() === year;
        html += `<div class="cal-day ${cans > 0 ? 'has-drinks' : ''}" style="${isToday ? 'border: 2px solid #2b7a4b;' : ''}">${day} ${dots}</div>`;
    }
    document.getElementById('calendarGrid').innerHTML = html;
}

document.getElementById('prevMonth').onclick = () => { currentCalDate.setMonth(currentCalDate.getMonth() - 1); renderCalendar(); };
document.getElementById('nextMonth').onclick = () => { currentCalDate.setMonth(currentCalDate.getMonth() + 1); renderCalendar(); };

// ===== Модалки выпитого =====
document.getElementById('btnIDrank').onclick = () => {
    document.getElementById('logDrinkDate').valueAsDate = new Date(); 
    document.getElementById('drinkLogModal').classList.add('active');
};

document.getElementById('drinkLogForm').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('logDrinkName').value.trim();
    const qty = parseInt(document.getElementById('logDrinkQty').value);
    const dateStr = document.getElementById('logDrinkDate').value;
    const dateObj = new Date(dateStr + 'T12:00:00');

    await db.collection('drink_logs').add({
        userLogin: userProfile.login,
        drinkName: name,
        quantity: qty,
        date: firebase.firestore.Timestamp.fromDate(dateObj),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('drinkLogModal').classList.remove('active');
    document.getElementById('drinkLogForm').reset();
    loadLogs();
};

document.getElementById('btnDeleteDrank').onclick = () => {
    const list = document.getElementById('drinkLogsList');
    if (!allLogs.length) { list.innerHTML = '<p>Нет записей.</p>'; }
    else {
        const sorted = [...allLogs].sort((a, b) => {
            const dA = a.date ? a.date.toDate() : new Date(0);
            const dB = b.date ? b.date.toDate() : new Date(0);
            return dB - dA;
        });
        list.innerHTML = sorted.map(log => {
            const d = log.date ? log.date.toDate().toLocaleDateString('ru-RU') : '';
            return `<div class="log-item">
                <div><strong>${escapeHtml(log.drinkName)}</strong> (${log.quantity} шт.) <br><small>${d}</small></div>
                <button class="btn-del-log" onclick="deleteLog('${log.id}')">×</button>
            </div>`;
        }).join('');
    }
    document.getElementById('deleteDrankModal').classList.add('active');
};

window.deleteLog = async (id) => {
    if(!confirm('Удалить запись?')) return;
    await db.collection('drink_logs').doc(id).delete();
    document.getElementById('deleteDrankModal').classList.remove('active');
    loadLogs();
};

window.showMyFavorites = () => {

    const favIds = userProfile.favorites || [];
    if (!favIds.length) {
        container.innerHTML = '<p>В избранном пусто.</p>';

                <img src="${img}">
                <span>${escapeHtml(drink.name)}</span>
            </div>`;
        }).join('');
    }
    document.getElementById('myFavsModal').classList.add('active');
};

// ===== Друзья и Заявки =====
async function loadFriendsAndRequests() {
    const friends = userProfile.friends || [];
    const sent = userProfile.sentRequests || [];
    const incoming = userProfile.incomingRequests || [];

    const containerFriends = document.getElementById('friendsList');
    const containerIncoming = document.getElementById('incomingRequestsSection');
    const containerSent = document.getElementById('sentRequestsSection');

    if (isOwnProfile) {
        if (incoming.length) {
            const html = await renderUserCards(incoming, 'incoming');
            containerIncoming.innerHTML = `<div class="friend-section-title">Входящие заявки</div><div class="friends-list">${html}</div>`;
        } else containerIncoming.innerHTML = '';

        if (sent.length) {
            const html = await renderUserCards(sent, 'sent');
            containerSent.innerHTML = `<div class="friend-section-title">Отправленные заявки</div><div class="friends-list">${html}</div>`;
        } else containerSent.innerHTML = '';
    } else {
        containerIncoming.innerHTML = '';
        containerSent.innerHTML = '';
        document.querySelector('.friend-section-title').textContent = 'Друзья пользователя';
    }

    if (friends.length) {
        containerFriends.innerHTML = await renderUserCards(friends, 'friend');
    } else {
        containerFriends.innerHTML = '<div class="empty-state">Друзей пока нет.</div>';
    }
}

async function renderUserCards(logins, type) {
    const results = await Promise.all(logins.map(login => 
        db.collection('users').where('login', '==', login).get()
            .then(s => s.empty ? { login, missing: true } : ({ id: s.docs[0].id, ...s.docs[0].data() }))
    ));

    return results.map(f => {
        if (f.missing) return `<div class="friend-card"><div class="friend-info"><div class="friend-name">${escapeHtml(f.login)}</div><div class="friend-login">Удален</div></div></div>`;
        
        const name = f.displayName || f.login;
        const avatar = f.avatar || getAvatarUri(name, f.login);
        
        let buttons = '';
        if (isOwnProfile) {
            if (type === 'incoming') {
                buttons = `<div>
                    <button class="btn-accept" onclick="event.stopPropagation(); handleRequest('${f.login}', 'accept')">Принять</button>
                    <button class="btn-reject" onclick="event.stopPropagation(); handleRequest('${f.login}', 'reject')">Отклонить</button>
                </div>`;
            } else if (type === 'sent') {
                buttons = `<button class="btn-remove-friend" onclick="event.stopPropagation(); cancelRequest('${f.login}')">Отменить</button>`;
            } else if (type === 'friend') {
                buttons = `<button class="btn-remove-friend" onclick="event.stopPropagation(); removeFriend('${f.login}')">Удалить</button>`;
            }
        }

        // Клик по карточке ведет на профиль этого человека
        return `<div class="friend-card" onclick="window.location.href='profile.html?user=${f.login}'" style="cursor: pointer;">
            <img class="friend-avatar" src="${escapeHtml(avatar)}" alt="">
            <div class="friend-info">
                <div class="friend-name">${escapeHtml(name)}</div>
                <div class="friend-login">@${escapeHtml(f.login)}</div>
            </div>
            ${buttons}
        </div>`;
    }).join('');
}

document.getElementById('addFriendBtn').onclick = async () => {
    const input = document.getElementById('friendLoginInput');
    const targetLoginInput = input.value.trim();
    if (!targetLoginInput || targetLoginInput === userProfile.login) return;

    const snap = await db.collection('users').where('login', '==', targetLoginInput).get();
    if (snap.empty) return alert('Пользователь не найден');

    const targetDoc = snap.docs[0];
    
    if ((userProfile.friends || []).includes(targetLoginInput)) return alert('Уже в друзьях');
    if ((userProfile.sentRequests || []).includes(targetLoginInput)) return alert('Заявка уже отправлена');

    if ((userProfile.incomingRequests || []).includes(targetLoginInput)) {
        await acceptFriend(targetLoginInput);
        return;
    }

    await userDocRef.update({ sentRequests: firebase.firestore.FieldValue.arrayUnion(targetLoginInput) });
    await targetDoc.ref.update({ incomingRequests: firebase.firestore.FieldValue.arrayUnion(userProfile.login) });

    input.value = '';
    userProfile.sentRequests = [...(userProfile.sentRequests||[]), targetLoginInput];
    loadFriendsAndRequests();
    alert('Заявка отправлена!');
};

window.handleRequest = async (senderLogin, action) => {
    if (action === 'accept') {
        await acceptFriend(senderLogin);
    } else {
        await userDocRef.update({ incomingRequests: firebase.firestore.FieldValue.arrayRemove(senderLogin) });
        const senderSnap = await db.collection('users').where('login', '==', senderLogin).get();
        if(!senderSnap.empty) await senderSnap.docs[0].ref.update({ sentRequests: firebase.firestore.FieldValue.arrayRemove(userProfile.login) });
        userProfile.incomingRequests = userProfile.incomingRequests.filter(l => l !== senderLogin);
        loadFriendsAndRequests();
    }
};

async function acceptFriend(senderLogin) {
    await userDocRef.update({
        friends: firebase.firestore.FieldValue.arrayUnion(senderLogin),
        incomingRequests: firebase.firestore.FieldValue.arrayRemove(senderLogin)
    });
    const senderSnap = await db.collection('users').where('login', '==', senderLogin).get();
    if(!senderSnap.empty) {
        await senderSnap.docs[0].ref.update({
            friends: firebase.firestore.FieldValue.arrayUnion(userProfile.login),
            sentRequests: firebase.firestore.FieldValue.arrayRemove(userProfile.login)
        });
    }
    userProfile.friends = [...(userProfile.friends||[]), senderLogin];
    userProfile.incomingRequests = userProfile.incomingRequests.filter(l => l !== senderLogin);
    loadFriendsAndRequests();
}

window.cancelRequest = async (targetLogin) => {
    await userDocRef.update({ sentRequests: firebase.firestore.FieldValue.arrayRemove(targetLogin) });
    const targetSnap = await db.collection('users').where('login', '==', targetLogin).get();
    if(!targetSnap.empty) await targetSnap.docs[0].ref.update({ incomingRequests: firebase.firestore.FieldValue.arrayRemove(userProfile.login) });
    userProfile.sentRequests = userProfile.sentRequests.filter(l => l !== targetLogin);
    loadFriendsAndRequests();
};

window.removeFriend = async (targetLogin) => {
    if(!confirm('Удалить из друзей?')) return;
    await userDocRef.update({ friends: firebase.firestore.FieldValue.arrayRemove(targetLogin) });
    const targetSnap = await db.collection('users').where('login', '==', targetLogin).get();
    if(!targetSnap.empty) await targetSnap.docs[0].ref.update({ friends: firebase.firestore.FieldValue.arrayRemove(userProfile.login) });
    userProfile.friends = userProfile.friends.filter(l => l !== targetLogin);
    loadFriendsAndRequests();
};
